version: "2"

linters:
  default: all
  disable:
    - cyclop
    - noctx
    - errcheck
    - lll
    - noinlineerr
    - nlreturn
    - gocyclo
    - testpackage
    - funlen
    - gochecknoinits
    - godox
    - gocognit
    - contextcheck
    - paralleltest
    - nestif
    - maintidx
    - depguard
    - exhaustruct
    - exhaustruct_v5
    - gomodguard
    - wrapcheck
    - varnamelen
    - gochecknoglobals
    - err113
    - tagliatelle
    - wsl
    - wsl_v5
    - nonamedreturns
    - ireturn
    - dupl
    - goconst
    - prealloc

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    exhaustive:
      default-signifies-exhaustive: true
    funlen:
      lines: 120
      statements: 40
    gocognit:
      min-complexity: 25
    gocyclo:
      min-complexity: 20
    gomoddirectives:
      replace-local: true
    govet:
      enable-all: true
      disable:
        - fieldalignment
    lll:
      line-length: 120
      tab-width: 4
    misspell:
      locale: US
    mnd:
      checks:
        - argument
        - assign
        - case
        - condition
        - operation
        - return
    nakedret:
      max-func-lines: 3
    revive:
      enable-all-rules: true
      rules:
        - name: add-constant
          disabled: true
        - name: argument-limit
          arguments:
            - 7
          severity: warning
        - name: banned-characters
          disabled: true
        - name: cognitive-complexity
          disabled: true
        - name: comment-spacings
          arguments:
            - nolint
          severity: warning
        - name: cyclomatic
          disabled: true
        - name: epoch-naming
          disabled: true
        - name: file-header
          disabled: true
        - name: function-result-limit
          arguments:
            - 3
          severity: warning
        - name: function-length
          disabled: true
        - name: get-return
          disabled: true
        - name: inefficient-map-lookup
          disabled: true
        - name: line-length-limit
          disabled: true
        - name: marshal-receiver
          disabled: true
        - name: max-public-structs
          disabled: true
        - name: modifies-value-receiver
          disabled: true
        - name: package-comments
          disabled: true
        - name: package-naming
          disabled: true
        - name: unused-receiver
          disabled: true
        - name: use-slices-sort
          disabled: true
        - name: use-waitgroup-go
          disabled: true
    sloglint:
      context: scope
    perfsprint:
      int-conversion: true
      err-error: true
      errorf: true
      sprintf1: true
      strconcat: true
  exclusions:
    generated: lax
    rules:
      - linters:
          - lll
        source: '^//go:generate '
      - linters:
          - funlen
          - maintidx
          - gocognit
          - gocyclo
        path: _test\.go$
      - linters:
          - revive
        path: ^pkg/proxy/http/
      - linters:
          - tagalign
        path: ^pkg/config/options\.go$
      - linters:
          - gosec
        text: "G101:"
        path: ^pkg/variable/constant\.go$
      - linters:
          - staticcheck
        text: "SA1019:"
        path: ^pkg/gateway/bifrost_test\.go$


issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - goimports
    - gofmt
    - golines
    - gci
    - gofumpt
  settings:
    gci:
      sections:
        - standard
        - default
        - localmodule
      custom-order: true
    gofmt:
      simplify: true
      rewrite-rules:
        - pattern: "interface{}"
          replacement: "any"
        - pattern: "a[b:len(a)]"
          replacement: "a[b:]"
    golines:
      max-len: 120